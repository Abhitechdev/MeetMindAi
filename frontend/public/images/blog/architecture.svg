<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; font-weight: 500; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .title { font-size: 16px; font-weight: bold; fill: #0f172a; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 4; }
      .arrow { fill: #94a3b8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Upload -->
  <rect class="box" x="50" y="50" width="200" height="70" />
  <text class="text title" x="150" y="80" text-anchor="middle">1. Audio Upload</text>
  <text class="subtext" x="150" y="100" text-anchor="middle">MP3, M4A, WAV (Max 100MB)</text>

  <path class="line" d="M 150 120 L 150 160" marker-end="url(#arrowhead)" />

  <!-- Compression -->
  <rect class="box" x="50" y="170" width="200" height="70" />
  <text class="text title" x="150" y="200" text-anchor="middle">2. Pre-processing</text>
  <text class="subtext" x="150" y="220" text-anchor="middle">FFmpeg 16kbps Mono (If >24MB)</text>

  <path class="line" d="M 250 205 L 340 205" marker-end="url(#arrowhead)" />

  <!-- Transcription -->
  <rect class="box" x="350" y="140" width="240" height="130" />
  <text class="text title" x="470" y="170" text-anchor="middle">3. Transcription Engine</text>
  <text class="subtext" x="470" y="195" text-anchor="middle">Fast Mode: Groq Whisper-Large-v3-Turbo</text>
  <text class="subtext" x="470" y="215" text-anchor="middle">Meeting Mode: Deepgram Nova-3 (Diarized)</text>
  <text class="subtext" x="470" y="245" text-anchor="middle">Output: Timestamped JSON &amp; Language</text>

  <path class="line" d="M 470 270 L 470 310" marker-end="url(#arrowhead)" />

  <!-- LLM Extraction -->
  <rect class="box" x="350" y="320" width="240" height="90" />
  <text class="text title" x="470" y="350" text-anchor="middle">4. LLM Extraction (Groq)</text>
  <text class="subtext" x="470" y="375" text-anchor="middle">Llama-3.3-70b-versatile</text>
  <text class="subtext" x="470" y="395" text-anchor="middle">JSON: Decisions, Action Items, Summary</text>

  <path class="line" d="M 350 365 L 260 365" marker-end="url(#arrowhead)" />

  <!-- Storage -->
  <rect class="box" x="50" y="330" width="200" height="70" />
  <text class="text title" x="150" y="360" text-anchor="middle">5. Secure Storage</text>
  <text class="subtext" x="150" y="380" text-anchor="middle">Supabase PostgreSQL + RLS</text>
</svg>
